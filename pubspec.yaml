name: sushiaya
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  crystal_navigation_bar: ^1.0.4
  provider: ^6.1.5+1
  flutter_launcher_icons: ^0.13.1
  easy_localization: ^3.0.3

  # Firebase dependencies (Auth only)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  firebase_messaging: ^15.2.10
  permission_handler: ^11.3.1
  firebase_database: ^11.3.10
  shimmer: ^3.0.0
  cached_network_image: ^3.2.3 # Add this line
  firebase_storage: ^12.4.10
  haptic_feedback: ^0.5.1+1
  sqflite: ^2.3.0
  path: ^1.8.3
  cloud_firestore: ^5.6.12
  path_provider: ^2.1.1
  geocoding: ^2.2.1
  
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/translations/

flutter_icons:
  android: true
  ios: true

  # Main app icon (recommended: 1024x1024 PNG)
  image_path: "images/Black and Red Simple Sushi Logo.png"

  # Android Adaptive Icon Configuration
  adaptive_icon_background: "#d5860f"
  adaptive_icon_foreground: "images/Black and Red Simple Sushi Logo.png"

  # iOS specific settings
  ios_icon_padding: 0.1 # Adds slight padding for iOS (0.0 to 0.5)

  # Optional: Different icons for different platforms
  # android_icon_path: "images/android_logo.png"
  # ios_icon_path: "images/ios_logo.png"

  # Generate different sizes (optional - auto-generated by default)
  generate_rounded_ios: true

  # Web icon (if you plan to support web)
  web:
    generate: true
    image_path: "images/logo.png"
    background_color: "#d5860f"
    theme_color: "#d5860f"
